<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Achievements Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #0A7C6C;
      --teal-dark: #087A63;
      --text: #292524;
      --muted:     #6b7280;
      --border:    #c8d0d8;
      --danger:    #dc2626;
      --success:   #059669;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #FAF9F6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .wrap {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo ── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .logo-svg { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; }

    .logo-text { display: flex; flex-direction: column; line-height: 1; }

    .logo-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--teal);
      letter-spacing: 0.04em;
    }

    .logo-tagline {
      font-size: 0.6rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-top: 3px;
    }

    .portal-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 4px;
    }

    .portal-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 28px;
      text-align: center;
    }

    /* ── Form & Steps ── */
    .step-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }

    .field { width: 100%; margin-bottom: 24px; }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--border);
      padding: 10px 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: transparent;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    .field input::placeholder { color: var(--muted); }
    .field input:focus { border-color: var(--teal); }

    /* ── Button ── */
    .btn {
      display: block;
      width: 160px;
      margin: 6px auto 0;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover   { background: var(--teal-dark); }
    .btn:active  { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Messages ── */
    .msg {
      font-size: 0.82rem;
      margin-top: 14px;
      text-align: center;
    }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--success); }

    /* ── Bottom links ── */
    .bottom-links {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 32px;
    }

    .bottom-links a {
      font-size: 0.82rem;
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- Logo -->
  <div class="logo-row">
    <img class="logo-svg" src="gitam-logo.png" alt="GITAM Logo" />
    <div class="logo-text">
      <span class="logo-name">GITAM</span>
      <span class="logo-tagline">Deemed to be University</span>
    </div>
  </div>

  <div class="portal-title">Reset Password</div>
  <p class="portal-sub">Follow the steps below to recover your account</p>

  <!-- Step 1: Email -->
  <div id="step-email" class="step-section">
    <p class="step-desc">Enter your registered email address.<br>We'll send you a 6-digit verification code.</p>
    <div class="field">
      <input type="email" id="email" placeholder="Email address" required autocomplete="off"/>
    </div>
    <button class="btn" id="sendOtpBtn">Send Code</button>
    <p id="emailMsg" class="msg"></p>
  </div>

  <!-- Step 2: OTP -->
  <div id="step-otp" class="step-section" style="display:none;">
    <p class="step-desc">Enter the 6-digit code sent to your email.</p>
    <div class="field">
      <input type="text" id="otp" maxlength="6" placeholder="000000" required autocomplete="off"/>
    </div>
    <button class="btn" id="verifyOtpBtn">Verify Code</button>
    <p id="otpMsg" class="msg"></p>
  </div>

  <!-- Step 3: Reset -->
  <div id="step-reset" class="step-section" style="display:none;">
    <p class="step-desc">Set a new, secure password.</p>
    <div class="field">
      <input type="password" id="newPassword" placeholder="New password (min 8 chars)" required autocomplete="new-password"/>
    </div>
    <button class="btn" id="resetBtn">Reset</button>
    <p id="resetMsg" class="msg"></p>
  </div>

  <div class="bottom-links">
    <a href="login.html">Back to Login</a>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
